name: Automated DB Backup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Trigger Backup Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/adroit
            # Exec into the backend container to run the backup script
            # Assumes PGPASSWORD and AWS credentials are in the .env file of the container
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python scripts/backup_db_postgres.py
