version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/adroit-backend:latest
    build: null
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/adroit-frontend:latest
    build: null
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  db:
    # Optional: If you use AWS RDS instead of this container, remove the db service from here
    # or scale it to 0. But assuming containerized DB for this file:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
